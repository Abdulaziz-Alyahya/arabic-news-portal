<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="قارن تغطية المصادر العربية للقصة نفسها في مكان واحد.">
    <title>مقارنة الأخبار العربية</title>
    <script src="/static/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a class="brand-title" href="/">مقارنة الأخبار العربية</a>
                <p>قصة واحدة، تغطيات متعددة</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="تغيير مظهر الموقع" aria-pressed="false">
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            </button>
        </div>
    </header>
    <main id="main" class="container" tabindex="-1">
        <section class="page-heading" aria-labelledby="page-title">
            <p class="eyebrow">تغطيات من مصادر عربية</p>
            <h1 id="page-title">أحدث القصص</h1>
            <p>اختر قصة، واقرأ كيف تناولتها المصادر المختلفة.</p>
        </section>
        <section id="stories" class="stories" aria-label="القصص الإخبارية" aria-busy="true">
            <p class="state" role="status">جارٍ تحميل القصص…</p>
        </section>
    </main>
    <footer class="container site-footer">مقارنة الأخبار العربية <span>مساحة لفهم اختلاف التغطية</span></footer>
    <script src="/static/ui.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
