name: Update Arabic News

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arabic-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-multilingual-e5-base

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news pipeline
        run: python pipeline.py

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update Arabic news data"
            git pull --rebase origin main
            git push origin main
          fi
